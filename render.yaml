# Render Blueprint: Render -> New -> Blueprint -> pick this repository.
# It builds the Dockerfile and gives the site an https address. You are asked
# for MCM_ACCESS_CODE (the office code employees type once) on creation.
#
# FREE PLAN: no persistent disk, so keep the data in a free Postgres database
# (e.g. Neon): set DATABASE_URL to its connection string. Without it the list,
# users and projects reset whenever the service sleeps or redeploys.
# MCM_ADMIN_NAME / MCM_ADMIN_PASSWORD: the manager, set again on every start.
services:
  - type: web
    name: mcmaster-orders
    runtime: docker
    plan: free
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: MCM_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MCM_ADMIN_NAME
        sync: false
      - key: MCM_ADMIN_PASSWORD
        sync: false
      - key: TZ
        value: Asia/Jerusalem
