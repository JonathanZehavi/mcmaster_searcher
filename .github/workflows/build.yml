name: Test and build

# Every push to master: run the tests, then publish fresh Windows / Mac files
# to the "latest" release, so the download links in the README always point
# at the newest version.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The runner image ships Google Chrome, which the browser tests drive.
      - name: Test
        run: go test -count=1 ./...
        env:
          MCM_NO_SANDBOX: "1"

      - name: Build
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          FLAGS="-s -w -X main.version=$VERSION"
          mkdir -p out
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$FLAGS" -o out/McMasterList.exe .
          # One universal Mac file (Apple chip + Intel), so nobody has to pick.
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$FLAGS" -o "mac-$arch" .
          done
          go run ./tools/fatmacho -o out/McMasterList mac-arm64 mac-amd64
          (cd out && zip -q McMasterList-mac.zip McMasterList && rm McMasterList)
          cp static/extractor.js out/extractor.js
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh out

      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --target "$GITHUB_SHA" \
            --title "Latest ($VERSION)" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Windows: McMasterList.exe. Mac: McMasterList-mac.zip (any Mac). extractor.js: drop into the McMasterList-data folder to update detection without a new download."

  # Builds the hosting image (Dockerfile / render.yaml) and does a real lookup
  # inside it, so a broken image never reaches Render.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build image
        run: docker build -t mcmaster-orders .

      - name: Smoke test (Chromium lookup inside the container)
        run: |
          go run ./tools/fakesite -addr 127.0.0.1:8765 &
          docker run -d --name app --network host \
            -e MCM_BASE_URL=http://127.0.0.1:8765 -e MCM_MIN_INTERVAL=0 -e MCM_NO_WARMUP=1 \
            mcmaster-orders
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8642/api/ping && break; sleep 1; done
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"name":"CI_Bot"}' http://127.0.0.1:8642/api/identify
          out=$(curl -fs -b jar 'http://127.0.0.1:8642/api/lookup?pn=8336N108')
          echo "$out"
          echo "$out" | grep -q '"name":"Shoulder Bolt Pair"'
          echo "$out" | grep -q '"price":25.93'
      - name: Container logs
        if: always()
        run: docker logs app || true
